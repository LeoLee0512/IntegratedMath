name: Build first-part review
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-noto-cjk fonts-dejavu poppler-utils
          python -m pip install -r requirements-build.txt
      - name: Build and validate
        run: |
          python tools/check_release_notes.py
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
          python tools/build_full_catalog.py
          python tools/draw_ch01_figures.py
          python tools/build_part1_review.py
          python tools/validate_part1_review.py --package
      - name: Save artifacts awaiting visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: first-part-review-pending-visual-and-source-review
          retention-days: 14
          path: |
            dist/
            build/part1/
